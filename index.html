<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Welcome to Pan Asia EZY</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#eef4ff 0%,#dbe8f7 100%);
    overflow:hidden;
}

/* Background circles */

body::before,
body::after{
    content:"";
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    z-index:-1;
}

body::before{
    width:280px;
    height:280px;
    background:#2b7de9;
    top:-80px;
    left:-80px;
    opacity:.18;
}

body::after{
    width:320px;
    height:320px;
    background:#00b4ff;
    bottom:-120px;
    right:-120px;
    opacity:.15;
}

/* Card */

.card{

    width:430px;
    max-width:92%;

    padding:45px 35px;

    background:rgba(255,255,255,.85);
    backdrop-filter:blur(18px);

    border-radius:22px;

    text-align:center;

    box-shadow:
        0 20px 45px rgba(0,0,0,.10);

    animation:fadeIn .7s ease;
}

/* Logo */

.logo{
    width:170px;
    margin-bottom:30px;
}

/* Check icon */

.icon{

    width:70px;
    height:70px;

    margin:0 auto 25px;

    border-radius:50%;

    background:#e8f5e9;

    display:flex;
    justify-content:center;
    align-items:center;

    color:#28a745;
    font-size:34px;
}

/* Heading */

h1{

    font-size:28px;
    color:#003b75;

    margin-bottom:15px;
}

/* Text */

.description{

    color:#666;

    font-size:15px;

    line-height:1.8;
}

/* Progress Bar */

.progress{

    width:100%;

    height:8px;

    background:#e9eef5;

    border-radius:50px;

    overflow:hidden;

    margin:35px 0 20px;
}

.progress span{

    display:block;

    width:35%;

    height:100%;

    background:linear-gradient(90deg,#0070f3,#00b7ff);

    animation:loading 2s linear infinite;
}

/* Footer */

.footer{

    font-size:13px;

    color:#8c98a4;
}

/* Animation */

@keyframes loading{

    from{
        margin-left:-35%;
    }

    to{
        margin-left:100%;
    }
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Responsive */

@media(max-width:480px){

.card{

    padding:35px 25px;
}

.logo{

    width:150px;
}

h1{

    font-size:24px;
}

.description{

    font-size:14px;
}

}

</style>

<script>

function redirectUser(){

    const ua = navigator.userAgent || navigator.vendor || window.opera;

    let redirectUrl = "https://ezy.pabcbank.com";

    if(/android/i.test(ua)){
        redirectUrl = "https://play.google.com/store/apps/details?id=com.fg.pabc";
    }
    else if(/iPad|iPhone|iPod/.test(ua) && !window.MSStream){
        redirectUrl = "https://apps.apple.com/lk/app/pan-asia-bank/id1211527373";
    }

    window.location.replace(redirectUrl);
}

window.onload = function(){

    setTimeout(redirectUser,2000);

};

</script>

</head>

<body>

<div class="card">

    <img
        class="logo"
        src="https://online.pabcbank.com/business/assets-2.0/resources/images/logo.jpg"
        alt="Pan Asia Bank">

    <div class="icon">
        ✓
    </div>

    <h1>Welcome to Pan Asia EZY</h1>

    <p class="description">
        Thank you for choosing <strong>Pan Asia EZY</strong>.<br>
        Please wait while we securely redirect you.
    </p>

    <div class="progress">
        <span></span>
    </div>

</div>

</body>
</html>
