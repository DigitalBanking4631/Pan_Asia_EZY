<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Welcome to Pan Asia EZY</title>

<style>
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fa;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:#fff;
    width:420px;
    max-width:90%;
    padding:40px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    text-align:center;
}

img{
    width:120px;
    margin-bottom:20px;
}

h1{
    color:#004b8d;
    margin-bottom:15px;
}

p{
    color:#555;
    font-size:12px;
}

.loader{
    margin:25px auto;
    width:45px;
    height:45px;
    border:5px solid #ddd;
    border-top:5px solid #004b8d;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}
</style>

<script>
function redirectUser(){

    const ua = navigator.userAgent;

    let url = "https://ezy.pabcbank.com";

    if(/android/i.test(ua)){
        url = "https://play.google.com/store/apps/details?id=com.fg.pabc";
    }
    else if(/iPad|iPhone|iPod/.test(ua) && !window.MSStream){
        url = "https://apps.apple.com/lk/app/pan-asia-bank/id1211527373";
    }

    window.location.replace(url);
}

window.onload=function(){

    // Redirect after 3 seconds
    setTimeout(redirectUser,2000);

}
</script>

</head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pan Asia EZY</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(135deg,#f5f7fa 0%,#dfe9f3 100%);
    overflow:hidden;
}

.card{

    width:430px;
    padding:45px;

    background:rgba(255,255,255,.82);
    backdrop-filter:blur(15px);

    border-radius:24px;

    box-shadow:
    0 15px 40px rgba(0,0,0,.08);

    text-align:center;

    animation:fade .7s ease;
}

.logo{

    width:180px;
    margin-bottom:35px;
}

.icon{

    width:70px;
    height:70px;

    margin:0 auto 25px;

    background:#e8f5e9;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    color:#28a745;

    font-size:34px;
}

h2{

    color:#1d3557;

    font-size:24px;

    font-weight:700;

    margin-bottom:15px;
}

p{

    color:#6c757d;

    font-size:12px;

    line-height:28px;

    margin-bottom:35px;
}

.loader{

    width:55px;
    height:55px;

    margin:auto;

    border:5px solid #dbe5ef;

    border-top:5px solid #0070f3;

    border-radius:50%;

    animation:spin 1s linear infinite;
}

.progress{

    margin-top:30px;

    width:100%;
    height:7px;

    background:#edf2f7;

    border-radius:30px;

    overflow:hidden;
}

.progress span{

    display:block;

    height:100%;

    width:35%;

    background:linear-gradient(90deg,#0070f3,#00b4ff);

    animation:progress 2s infinite;
}

.small{

    margin-top:25px;

    color:#9aa5b1;

    font-size:13px;
}

@keyframes spin{

    100%{
        transform:rotate(360deg);
    }
}

@keyframes progress{

    0%{
        margin-left:-35%;
    }

    100%{
        margin-left:100%;
    }
}

@keyframes fade{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:500px){

.card{

    width:90%;
    padding:35px 25px;
}

.logo{

    width:150px;
}

h2{

    font-size:24px;
}

}

</style>

</head>

<body>

<div class="card">

    <img class="logo"
         src="https://online.pabcbank.com/business/assets-2.0/resources/images/logo.jpg"
         alt="Pan Asia Bank">

    <div >
  
    </div>

    <h2>Welcome to Pan Asia EZY </h2>

    <p>
        Thank you for choosing <strong>Pan Asia EZY</strong>.<br>
        Please wait while we securely redirect you to the requested service.
    </p>

    <div class="progress">
        <span></span>
    </div>

    <div class="small">
        Secure Redirect
    </div>

</div>
</body>
</html>
