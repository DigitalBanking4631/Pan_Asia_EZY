<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<meta name="theme-color" content="#0B2545">
<meta name="robots" content="noindex">
<title>Welcome to Pan Asia EZY</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

<style>

:root{
    color-scheme:light;

    /* Token system */
    --ocean-deep:#0B2545;
    --signal-blue:#1E6FEB;
    --sky-mist:#EAF2FF;
    --cloud-white:#FFFFFF;
    --amber:#FFB020;
    --slate:#5B6B82;

    --font-display:'Manrope',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    color-scheme:light;
    background:var(--sky-mist);
    -webkit-text-size-adjust:100%;
}

body{
    min-height:100vh;
    min-height:100dvh;

    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;

    font-family:var(--font-body);

    background:
        radial-gradient(560px 420px at 12% -10%, rgba(30,111,235,.16), transparent 60%),
        radial-gradient(520px 420px at 108% 112%, rgba(11,37,69,.14), transparent 60%),
        var(--sky-mist);

    color:var(--ocean-deep);

    position:relative;
    overflow:hidden;
}

/* Card */

.card{
    width:420px;
    max-width:100%;

    padding:clamp(32px, 6vw, 48px) clamp(24px, 5vw, 38px);

    background:var(--cloud-white);

    border-radius:24px;
    border:1px solid rgba(11,37,69,.06);

    text-align:center;

    box-shadow:0 24px 60px -20px rgba(11,37,69,.28);

    animation:rise .6s cubic-bezier(.16,1,.3,1) both;

    position:relative;
    z-index:1;
}

/* Logo */

.logo{
    width:150px;
    display:block;
    margin:0 auto 28px;
}

/* Banner */

.banner{
    width:100%;
    margin-bottom:28px;
    overflow:hidden;
    border-radius:16px;
    box-shadow:0 12px 28px -12px rgba(11,37,69,.35);
    aspect-ratio:16/9;
    background:var(--sky-mist);
}

.banner img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
}

/* Heading */

h1{
    font-family:var(--font-display);
    font-weight:800;
    font-size:clamp(20px, 4.5vw, 24px);
    letter-spacing:-.01em;
    color:var(--ocean-deep);
    margin-bottom:10px;
}

.subtext{
    color:var(--slate);
    font-size:14.5px;
    line-height:1.6;
    max-width:32ch;
    margin:0 auto;
}

/* Signature element: a step tracker, since a real two-step
   handoff (verify -> redirect) is happening, not decoration */

.status{
    margin:32px 0 26px;
}

.status-track{
    position:relative;
    height:4px;
    border-radius:50px;
    background:var(--sky-mist);
    overflow:hidden;
}

.status-track span{
    position:absolute;
    inset:0;
    width:40%;
    border-radius:50px;
    background:linear-gradient(90deg, var(--signal-blue), var(--amber));
    animation:sweep 1.6s ease-in-out infinite;
}

.status-label{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:14px;

    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:.02em;
    color:var(--slate);
}

.status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--signal-blue);
    animation:pulse 1.6s ease-in-out infinite;
    flex:none;
}

/* Manual fallback, shown once JS confirms redirect is imminent
   or immediately for no-JS agents */

.fallback{
    margin-top:22px;
    font-size:13px;
    color:var(--slate);
}

.fallback a{
    color:var(--signal-blue);
    font-weight:600;
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition:border-color .15s ease;
}

.fallback a:hover,
.fallback a:focus-visible{
    border-color:currentColor;
}

.fallback a:focus-visible{
    outline:2px solid var(--signal-blue);
    outline-offset:3px;
    border-radius:2px;
}

.footer{
    margin-top:26px;
    font-size:12px;
    color:#9AA7B8;
}

/* Animations */

@keyframes sweep{
    0%{ transform:translateX(-120%); }
    100%{ transform:translateX(320%); }
}

@keyframes pulse{
    0%, 100%{ opacity:.35; transform:scale(.85); }
    50%{ opacity:1; transform:scale(1); }
}

@keyframes rise{
    from{ opacity:0; transform:translateY(18px); }
    to{ opacity:1; transform:translateY(0); }
}

@media (prefers-reduced-motion: reduce){
    *{
        animation-duration:.001ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.001ms !important;
    }
}

/* Mobile */

@media (max-width:480px){
    .logo{ width:130px; }
}

/* Force light appearance even in system dark mode */

@media (prefers-color-scheme: dark){
    html{ background:var(--sky-mist) !important; }
    body{ color:var(--ocean-deep) !important; }
    .card{ background:var(--cloud-white) !important; color:var(--ocean-deep) !important; }
    img{ filter:none !important; -webkit-filter:none !important; }
}

</style>

<script>
function redirectUser(){
    var ua = navigator.userAgent || navigator.vendor || window.opera;
    var redirectUrl = "https://ezy.pabcbank.com";

    if(/android/i.test(ua)){
        redirectUrl = "https://play.google.com/store/apps/details?id=com.fg.pabc";
    }
    else if(/iPad|iPhone|iPod/.test(ua) && !window.MSStream){
        redirectUrl = "https://apps.apple.com/lk/app/pan-asia-bank/id1211527373";
    }

    var link = document.getElementById("fallback-link");
    if(link){
        link.href = redirectUrl;
    }

    window.location.replace(redirectUrl);
}

window.onload = function(){
    var label = document.getElementById("status-label");

    setTimeout(function(){
        if(label){ label.textContent = "Redirecting you now"; }
    }, 1100);

    setTimeout(redirectUser, 2000);
};
</script>

</head>

<body>

<main class="card">

    <img class="logo" src="logo.jpg" alt="Pan Asia Bank">

    <div class="banner">
        <img src="ChatGPT Image Jul 24, 2026, 10_26_25 AM.png" alt="Pan Asia EZY promotion">
    </div>

    <h1>Welcome to Pan Asia EZY</h1>
    <p class="subtext">Please wait while we securely redirect you.</p>

    <div class="status">
        <div class="status-track"><span></span></div>
        <div class="status-label">
            <span class="status-dot"></span>
            <span id="status-label">Verifying your device</span>
        </div>
    </div>

    <p class="footer">Thank you for choosing Pan Asia Bank.</p>

</main>

<noscript>
    <style>.status{ display:none; }</style>
</noscript>

</body>
</html>
