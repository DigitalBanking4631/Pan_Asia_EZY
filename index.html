<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Force Light Theme -->
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<meta name="theme-color" content="#ffffff">

<title>Welcome to Pan Asia EZY</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    color-scheme:light;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

html{
    color-scheme:light;
    background:#eef4ff;
    -webkit-text-size-adjust:100%;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(135deg,#eef4ff 0%,#dbe8f7 100%);

    color:#000;

    overflow:hidden;
}

/* Background */

body::before,
body::after{

    content:"";

    position:absolute;

    border-radius:50%;

    filter:blur(80px);

    z-index:-1;
}

body::before{

    width:280px;
    height:280px;

    background:#2b7de9;

    top:-80px;
    left:-80px;

    opacity:.18;
}

body::after{

    width:320px;
    height:320px;

    background:#00b4ff;

    bottom:-120px;
    right:-120px;

    opacity:.15;
}

/* Card */

.card{

    width:430px;
    max-width:92%;

    padding:45px 35px;

    background:#ffffff;

    border-radius:22px;

    text-align:center;

    box-shadow:0 20px 45px rgba(0,0,0,.10);

    animation:fadeIn .7s ease;

    color:#000;
}

/* Logo */

.logo{

    width:170px;

    margin-bottom:30px;

    display:block;

    margin-left:auto;
    margin-right:auto;

    filter:none !important;
    -webkit-filter:none !important;
}

/* Heading */

h2{

    font-size:24px;

    color:#003b75;

    margin-bottom:15px;
}

/* Text */

.description{

    color:#666;

    font-size:15px;

    line-height:1.8;
}

/* Progress */

.progress{

    width:100%;

    height:8px;

    background:#e9eef5;

    border-radius:50px;

    overflow:hidden;

    margin:35px 0 20px;
}

.progress span{

    display:block;

    width:35%;

    height:100%;

    background:linear-gradient(90deg,#0070f3,#00b7ff);

    animation:loading 2s linear infinite;
}

/* Footer */

.footer{

    font-size:13px;

    color:#8c98a4;
}

/* Animations */

@keyframes loading{

    from{
        margin-left:-35%;
    }

    to{
        margin-left:100%;
    }
}

@keyframes fadeIn{

    from{

        opacity:0;

        transform:translateY(30px);
    }

    to{

        opacity:1;

        transform:translateY(0);
    }
}

/* Mobile */

@media(max-width:480px){

    .card{

        padding:35px 25px;
    }

    .logo{

        width:150px;
    }

    h2{

        font-size:20px;
    }

    .description{

        font-size:14px;
    }
}

/* Force same colors even if device is in Dark Mode */

@media (prefers-color-scheme: dark){

    html{
        background:#eef4ff !important;
    }

    body{

        background:linear-gradient(135deg,#eef4ff 0%,#dbe8f7 100%) !important;

        color:#000 !important;
    }

    .card{

        background:#ffffff !important;

        color:#000 !important;

        box-shadow:0 20px 45px rgba(0,0,0,.10);
    }

    h2{

        color:#003b75 !important;
    }

    .description{

        color:#666 !important;
    }

    .footer{

        color:#8c98a4 !important;
    }

    .progress{

        background:#e9eef5 !important;
    }

    .progress span{

        background:linear-gradient(90deg,#0070f3,#00b7ff) !important;
    }

    img{

        filter:none !important;
        -webkit-filter:none !important;
    }
}

</style>

<script>

function redirectUser(){

    const ua = navigator.userAgent || navigator.vendor || window.opera;

    let redirectUrl = "https://ezy.pabcbank.com";

    if(/android/i.test(ua)){
        redirectUrl="https://play.google.com/store/apps/details?id=com.fg.pabc";
    }
    else if(/iPad|iPhone|iPod/.test(ua) && !window.MSStream){
        redirectUrl="https://apps.apple.com/lk/app/pan-asia-bank/id1211527373";
    }

    window.location.replace(redirectUrl);
}

window.onload=function(){

    setTimeout(redirectUser,2000);

};

</script>

</head>

<body>

<div class="card">

    <img
        class="logo"
        src="https://online.pabcbank.com/business/assets-2.0/resources/images/logo.jpg"
        alt="Pan Asia Bank Logo">

    <h2>Welcome to Pan Asia EZY</h2>

    <p class="description">
        Please wait while we securely redirect you.
    </p>

    <div class="progress">
        <span></span>
    </div>

    <p class="description">
        Thank you for choosing <strong>Pan Asia EZY</strong>.
    </p>

</div>

</body>
</html>
